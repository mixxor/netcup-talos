---
# netcup has no load balancer, so a Service of type LoadBalancer would sit in
# "pending" forever. Traefik runs on every node instead and the entry point is
# DNS with one A record per worker, or an haproxy in front.
deployment:
  kind: DaemonSet
service:
  enabled: false
# Traefik binds 8000/8443 inside the container and maps them to the host ports,
# so it never needs NET_BIND_SERVICE.
ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        enabled: true
ingressClass:
  enabled: true
  isDefaultClass: true
ingressRoute:
  dashboard:
    enabled: false
providers:
  kubernetesIngress:
    enabled: true
    # Nothing to publish without a Service.
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
# 4 GB per node, so keep it modest.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
logs:
  general:
    level: INFO
  access:
    enabled: true
